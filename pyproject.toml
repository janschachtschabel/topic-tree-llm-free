[project]
name = "topic-tree-llm-free"
version = "1.0.0"
description = "Themenbäume ohne generatives LLM: aus GND, Wikipedia, Wikidata oder einer Inhaltsmenge (Embeddings + Clustering)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "fastembed>=0.4",
    "model2vec>=0.4",
    "simplemma>=1.1",
]

[tool.uv]
package = false
