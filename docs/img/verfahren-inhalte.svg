<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8a86"/></marker></defs><rect x="0" y="0" width="1180" height="600" rx="14" fill="#fcfcfb" stroke="#dbe2df"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#16201d" font-weight="700" text-anchor="start">Inhaltsmenge → Themenbaum ohne LLM</text><text x="24" y="62" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#4a5753" font-weight="400" text-anchor="start">Embeddings sind Zahlenvektoren für Bedeutung, kein Textgenerator. Die Struktur entsteht aus den Inhalten oder aus einem fertigen Gerüst.</text><rect x="24" y="250" width="160" height="100" rx="9" fill="#e2efeb" stroke="#1f6b5c" stroke-width="1.4"/><text x="36" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#16201d" font-weight="700" text-anchor="start">Inhalte</text><text x="36" y="291" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">Titel + Beschreibung</text><text x="36" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">(z. B. 100 Inhalte)</text><line x1="186" y1="300" x2="214" y2="300" stroke="#7d8a86" stroke-width="1.6" marker-end="url(#a)"/><rect x="216" y="250" width="170" height="100" rx="9" fill="#ffffff" stroke="#dbe2df" stroke-width="1.4"/><text x="228" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#16201d" font-weight="700" text-anchor="start">Text vorbereiten</text><text x="228" y="291" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">Volltext oder nur</text><text x="228" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">Substantive (für</text><text x="228" y="323" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">model2vec)</text><line x1="388" y1="300" x2="416" y2="300" stroke="#7d8a86" stroke-width="1.6" marker-end="url(#a)"/><rect x="418" y="250" width="180" height="100" rx="9" fill="#ffffff" stroke="#dbe2df" stroke-width="1.4"/><text x="430" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#16201d" font-weight="700" text-anchor="start">Embeddings</text><text x="430" y="291" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">mpnet, MiniLM</text><text x="430" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">(Transformer, lokal)</text><text x="430" y="323" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">oder model2vec (statisch)</text><line x1="600" y1="290" x2="640" y2="160" stroke="#7d8a86" stroke-width="1.6" marker-end="url(#a)"/><rect x="642" y="95" width="230" height="120" rx="9" fill="#ffffff" stroke="#1f6b5c" stroke-width="1.4"/><text x="654" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f6b5c" font-weight="700" text-anchor="start">A · Gruppen bilden</text><text x="654" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">agglomerativ (Ward):</text><text x="654" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">Ebene 1 = k Gruppen,</text><text x="654" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">große Gruppen erneut</text><text x="654" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">geteilt</text><line x1="874" y1="155" x2="902" y2="155" stroke="#7d8a86" stroke-width="1.6" marker-end="url(#a)"/><rect x="904" y="80" width="250" height="150" rx="9" fill="#ffffff" stroke="#dbe2df" stroke-width="1.4"/><text x="916" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#16201d" font-weight="700" text-anchor="start">Gruppen benennen</text><text x="916" y="121" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">Begriff aus den Texten</text><text x="916" y="137" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">GND-Schlagwort (Hybrid)</text><text x="916" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">Wikipedia-Artikel (Hybrid)</text><text x="916" y="169" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">Knoten einer Taxonomie,</text><text x="916" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">z. B. Wikidata (Hybrid)</text><line x1="600" y1="310" x2="640" y2="440" stroke="#7d8a86" stroke-width="1.6" marker-end="url(#a)"/><rect x="642" y="385" width="230" height="120" rx="9" fill="#ffffff" stroke="#b8561c" stroke-width="1.4"/><text x="654" y="407" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#b8561c" font-weight="700" text-anchor="start">B · Gerüst einsortieren</text><text x="654" y="426" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">Baum zum Thema aus</text><text x="654" y="442" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">Wikipedia, Wikidata oder</text><text x="654" y="458" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">GND (wie „Thema → Baum“)</text><line x1="874" y1="445" x2="902" y2="445" stroke="#7d8a86" stroke-width="1.6" marker-end="url(#a)"/><rect x="904" y="385" width="250" height="120" rx="9" fill="#ffffff" stroke="#dbe2df" stroke-width="1.4"/><text x="916" y="407" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#16201d" font-weight="700" text-anchor="start">Einordnen</text><text x="916" y="426" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">Inhalt → ähnlichster Knoten</text><text x="916" y="442" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">(Kosinus); unter der</text><text x="916" y="458" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">Schwelle: nicht zugeordnet;</text><text x="916" y="474" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a5753" font-weight="400" text-anchor="start">leere Äste kappen</text><text x="24" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7d8a86" font-weight="400" text-anchor="start">Bewertung mit Beispieldaten: Reinheit, ARI und NMI gegenüber Soll-Kategorien; Namensnähe = Ähnlichkeit zwischen Gruppenname und Soll-Kategorie.</text></svg>